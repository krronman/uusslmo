<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky Colosseum Online</title>
<style>
html,body{margin:0;height:100%;background:#8fc4f5;overflow:hidden;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;background:rgba(20,30,60,.65);color:#fff;padding:6px 12px;border-radius:999px;font-size:13px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:rgba(20,30,60,.65);color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;white-space:nowrap}
kbd{background:#fff;color:#123;border-radius:4px;padding:1px 6px;margin:0 1px;font-weight:700}
#chat{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(58px + env(safe-area-inset-bottom,0px));width:min(360px,86vw);display:none;padding:8px 12px;border-radius:10px;border:2px solid #fff;font-size:15px;outline:none}
#login{position:fixed;inset:0;background:rgba(15,25,55,.55);display:flex;align-items:center;justify-content:center;z-index:5}
#login form{background:#fff;color:#123;padding:24px;border-radius:14px;text-align:center;width:min(300px,80vw)}
#login h1{margin:0 0 12px;font-size:20px}
#login input{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:2px solid #9ab;border-radius:8px;margin-bottom:12px}
#login button{width:100%;padding:10px;font-size:16px;border:0;border-radius:8px;background:#2196f3;color:#fff;font-weight:700;cursor:pointer}
#readyBtn{font:700 15px system-ui,sans-serif;border:2px solid #fff;border-radius:10px;color:#fff;background:rgba(20,30,60,.75);padding:10px 16px;cursor:pointer}
#readyBtn{position:fixed;left:50%;top:60%;transform:translateX(-50%);min-width:90px;font-size:18px}
#readyBtn.on{background:#2e9e4f}
#classBtn{position:fixed;right:12px;top:50%;margin-top:-25px;width:110px;height:51px;padding:0;border:0;cursor:pointer;background:url(class-btn.png?v=2) 0 0/110px 51px no-repeat;z-index:4}
#classBtn:hover{filter:brightness(1.12)}
#chatLog{position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(300px,60vw);background:rgba(20,30,60,.72);color:#fff;border:2px solid #fff;border-radius:10px;font-size:13px;z-index:3;overflow:hidden}
#clHead{padding:6px 10px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.12);user-select:none;display:flex;justify-content:space-between}
#clBody{height:170px;overflow-y:auto;padding:6px 10px;line-height:1.35;word-break:break-word}
#chatLog.min #clBody{display:none}
#clBody div{margin-bottom:3px}
#clBody .sys{color:#ffe066}
#clBody .tm{opacity:.55;font-size:11px;margin-right:4px}
#banner{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:8px 20px;border-radius:12px;background:rgba(20,30,60,.75);color:#fff;font:700 20px system-ui,sans-serif;display:none;z-index:3;white-space:nowrap;border:2px solid #fff}
#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .6s;z-index:6}
#readyBtn.off{opacity:.45;cursor:not-allowed}
#csScreen{position:fixed;inset:0;background:rgba(10,12,30,.74);display:none;align-items:center;justify-content:center;z-index:7}
#csBox{position:relative;width:min(96vw,calc(94vh * 1482 / 1002));aspect-ratio:1482/1002;--u:1px;font-family:'Galmuri11','Press Start 2P','DotGothic16',monospace;color:#e9e6ff}
#csBg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
#csBox>*:not(#csBg){position:absolute;box-sizing:border-box}
.csSlot{background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;border-radius:calc(var(--u)*8)}
.csSlot img{width:68%;height:68%;image-rendering:pixelated;object-fit:contain;pointer-events:none}
.csSlot:hover{background:rgba(255,255,255,.08)}
.csSlot.sel{outline:calc(var(--u)*4) solid #ffd66b;outline-offset:calc(var(--u)*-4);background:rgba(255,214,107,.13);box-shadow:0 0 calc(var(--u)*18) rgba(255,214,107,.5)}
.csSlot.lock span{font:calc(var(--u)*30) 'Press Start 2P',monospace;color:#4b4690}
.csSlot .eq{position:absolute;right:calc(var(--u)*12);top:calc(var(--u)*8);font-style:normal;font-size:calc(var(--u)*18);color:#ffd66b;display:none}
#csPrev{display:flex;align-items:center;justify-content:center;overflow:hidden}
#csPrev img{height:76%;image-rendering:pixelated;animation:csBob 1.2s steps(2) infinite}
#csPrev span{font:calc(var(--u)*90) 'Press Start 2P',monospace;color:#4b4690}
@keyframes csBob{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--u)*-8))}}
#csName{display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--u)*22)}
#csName b{font-size:calc(var(--u)*22);color:#fff;text-shadow:calc(var(--u)*2) calc(var(--u)*2) 0 #1b1850}
#csName i{font-style:normal;font-size:calc(var(--u)*15);color:#ffd66b}
.csSk{display:flex;align-items:center;gap:calc(var(--u)*10);padding:0 calc(var(--u)*14);overflow:hidden}
.csSk .ic{flex:none;width:calc(var(--u)*44);height:calc(var(--u)*44);display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*26);background:rgba(120,110,220,.18);border:calc(var(--u)*2) solid #5b55a8;border-radius:calc(var(--u)*6)}
.csSk .tx{flex:1;min-width:0}
.csSk .nm{display:flex;justify-content:space-between;align-items:baseline;gap:calc(var(--u)*8);line-height:1.25}
.csSk .nm b{font-size:calc(var(--u)*15);color:#ffd66b;white-space:nowrap}
.csSk .nm i{font-style:normal;font-size:calc(var(--u)*12);color:#b9b3ff;white-space:nowrap}
.csSk .ds{font-size:calc(var(--u)*12.5);line-height:1.2;color:#dcd8ff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#csStyle{display:flex;align-items:center;padding:0 calc(var(--u)*6);font-size:calc(var(--u)*16);line-height:1.3;color:#dcd8ff}
#csOk{background:none;border:0;cursor:pointer;font-family:inherit;font-size:calc(var(--u)*20);color:#fff;text-shadow:calc(var(--u)*2) calc(var(--u)*2) 0 #3a2f78;letter-spacing:calc(var(--u)*1)}
#csOk:hover:not(:disabled){filter:brightness(1.25)}
#csOk:disabled{cursor:default;color:#c9c4ff;opacity:.75}
#csClose{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:14px;width:36px;height:36px;border-radius:50%;border:2px solid #fff;background:rgba(20,30,60,.8);color:#fff;font-size:16px;cursor:pointer;z-index:8;display:none}
#csScreen[style*="flex"] #csClose{display:block}
#skillbar{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;gap:8px;z-index:3}
.sk{position:relative;width:52px;height:52px;background:rgba(20,30,60,.8);border:2px solid #fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px}
.sk b{position:absolute;left:4px;top:1px;font-size:11px;color:#ffe066}
.sk i{position:absolute;inset:0;border-radius:6px;display:none;align-items:center;justify-content:center;font:700 20px system-ui,sans-serif;font-style:normal;background:rgba(0,0,0,.62);color:#fff}
.sk.cd i{display:flex}
</style>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" rel="stylesheet">
</head><body>
<canvas id="c"></canvas>
<div id="hud">Connecting…</div>
<div id="hint">Aim 🖱 · Move <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> · Chat <kbd>Enter</kbd> · Attack <kbd>F</kbd> · Skills <kbd>Q</kbd><kbd>E</kbd><kbd>R</kbd></div>
<input id="chat" maxlength="60" placeholder="Type a message and press Enter" autocomplete="off">
<button id="classBtn" aria-label="class"></button>
<button id="readyBtn">0/2</button>
<div id="chatLog"><div id="clHead"><span>💬 Chat</span><span id="clArrow">▾</span></div><div id="clBody"></div></div>
<div id="skillbar"><div class="sk" data-k="Q"><b>Q</b><span>⚔️</span><i></i></div><div class="sk" data-k="E"><b>E</b><span>💨</span><i></i></div><div class="sk" data-k="R"><b>R</b><span>🗡️</span><i></i></div></div>
<div id="csScreen"><div id="csBox"><img id="csBg" src="cs-frame.png" alt="" draggable="false"></div><button id="csClose" aria-label="close">✕</button></div>
<div id="banner"></div><div id="fade"></div>
<div id="login"><form id="lf"><h1>🏛️ Sky Colosseum</h1>
<input id="name" maxlength="14" placeholder="Your name" autocomplete="off"><button>Enter the arena</button></form></div>
<script>
const W=1254, PX=5;
const cv=document.getElementById('c'), ctx=cv.getContext('2d'), hud=document.getElementById('hud');
const chatEl=document.getElementById('chat'), login=document.getElementById('login');
const bg=new Image(); bg.src='bg.jpg';
const spImg=new Image(); spImg.src='player.png';
const swordImg=new Image();swordImg.src='sword.png';
const arrowImg=new Image();arrowImg.src='arrow.png';
const bowImg=new Image();bowImg.src='bow.png';
const clsImg={};for(const c of ['Knight','Archer','Shielder','Assassin']){const i=new Image();i.src=c.toLowerCase()+'.png';clsImg[c]=i}
let vw,vh,scale,ox,oy,dpr;
function resize(){dpr=devicePixelRatio||1;vw=innerWidth;vh=innerHeight;cv.width=vw*dpr;cv.height=vh*dpr;
 scale=Math.min(vw,vh)/W*dpr;ox=(cv.width-W*scale)/2;oy=(cv.height-W*scale)/2}
addEventListener('resize',resize);resize();

// ---- per-player shirt colour ----
const hsl=(h,s,l)=>{s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[f(0)*255,f(8)*255,f(4)*255]};
const cache={},blankSp=document.createElement('canvas');blankSp.width=blankSp.height=15;
function spriteFor(hue,cls){
 const im=cls&&clsImg[cls];
 if(im&&im.complete&&im.naturalWidth)return im;
 if(!(spImg.complete&&spImg.naturalWidth))return blankSp;     // image not loaded yet: draw nothing and don't cache
 if(cache[hue])return cache[hue];
 const c=document.createElement('canvas');c.width=15;c.height=15;const x=c.getContext('2d');x.drawImage(spImg,0,0);
 const d=x.getImageData(0,0,15,15),a=d.data,li=hsl(hue,85,55),da=hsl(hue,85,42);
 for(let i=0;i<a.length;i+=4){if(a[i+2]>200&&a[i]<60){const c2=a[i+1]>=165?li:da;a[i]=c2[0];a[i+1]=c2[1];a[i+2]=c2[2]}}
 x.putImageData(d,0,0);return cache[hue]=c;
}
// ---- chat log window ----
const CHAT_TTL=10*60*1000,clBody=document.getElementById('clBody'),chatLogEl=document.getElementById('chatLog');
const banner=document.getElementById('banner'),fade=document.getElementById('fade'),logs=[];
document.getElementById('clHead').onclick=()=>{chatLogEl.classList.toggle('min');document.getElementById('clArrow').textContent=chatLogEl.classList.contains('min')?'▸':'▾'};
function addLog(name,text,sys,age){
 const at=Date.now()-(age||0),d=new Date(at),el=document.createElement('div'),tm=document.createElement('span');
 tm.className='tm';tm.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
 el.append(tm,sys?text:name+': '+text);if(sys)el.className='sys';
 const stick=clBody.scrollTop+clBody.clientHeight>=clBody.scrollHeight-20;
 clBody.appendChild(el);logs.push({at,el});
 if(stick)clBody.scrollTop=clBody.scrollHeight;
}
setInterval(()=>{const lim=Date.now()-CHAT_TTL;while(logs.length&&logs[0].at<lim)logs.shift().el.remove()},5000);
function flash(){fade.style.transition='none';fade.style.opacity=.9;requestAnimationFrame(()=>requestAnimationFrame(()=>{fade.style.transition='opacity .6s';fade.style.opacity=0}))}
// ---- networking ----
let ws,myId=null,joined=false,snapUntil=0,arena=null;
let phase='lobby',zone=1,myRole=0,snapNext=false,cdEnd=0,winnerText='',winnerUntil=0,myCls='';
const skCd={Q:0,E:0,R:0},fxs=[],hits=[];
const others=new Map(),bubbles=new Map();
function connect(){
 ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
 ws.onopen=()=>{hud.textContent='Connected';if(joined)ws.send(JSON.stringify({t:'join',name:nameEl.value}))};
 ws.onclose=()=>{hud.textContent='Disconnected – reconnecting…';others.clear();setTimeout(connect,1500)};
 ws.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.t==='hello'){myId=m.id;arena=m.arena}
  else if(m.t==='history'){clBody.innerHTML='';logs.length=0;for(const c of m.log)addLog(c.name,c.text,c.sys,c.age)}
  else if(m.t==='state'){
   phase=m.ph;zone=m.z;
   const seen=new Set();
   for(const p of m.p){
    seen.add(p.id);
    let o=others.get(p.id);
    if(!o){o={x:p.x,y:p.y,phase:0,face:p.f};others.set(p.id,o)}
    if(snapNext){o.x=p.x;o.y=p.y}
    const f0=o.face;
    Object.assign(o,{tx:p.x,ty:p.y,name:p.name,hue:p.hue,moving:p.m,sm:p.m,face:p.f,aim:p.a,cls:p.c,ready:p.r,role:p.o,hp:p.hp,mh:p.mh,su:p.su,gd:p.gd,sl:p.sl});
    if(p.id===myId)o.face=f0;   // own facing is driven by the cursor locally
   }
   snapNext=false;
   for(const id of others.keys())if(!seen.has(id))others.delete(id);
   const me=m.p.find(p=>p.id===myId),total=m.p.length,rc=m.p.filter(p=>p.r).length;
   myRole=me?me.o:0;
   hud.textContent=phase==='round'?'Round in progress · alive: '+m.p.filter(p=>p.o===1).length:'Players online: '+total;
   readyBtn.style.display=phase==='lobby'?'':'none';
   readyBtn.textContent=rc+'/'+Math.max(total,2);
   readyBtn.classList.toggle('off',total<2);
   readyBtn.classList.toggle('on',!!(me&&me.r));
   if(myCls!==(me?me.c:'')){myCls=me?me.c:'';csRender()}
   classBtn.style.display=phase==='lobby'?'':'none';
   if(phase!=='lobby'&&csIsOpen())csClose();
   skillbar.style.display=(myCls==='Knight'&&myRole!==2)?'flex':'none';
  }
  else if(m.t==='chat'){addLog(m.name,m.text,m.sys,0);if(m.id)bubbles.set(m.id,{text:m.text,until:performance.now()+4000})}
  else if(m.t==='countdown'){cdEnd=m.ms?performance.now()+m.ms:0}
  else if(m.t==='tp'){snapNext=true;arrowsC.length=0;flash()}
  else if(m.t==='pong'){rtt=rtt*.6+(performance.now()-m.c)*.4}
  else if(m.t==='arrow'){m.t0=performance.now();
   if(m.by===myId){const i=arrowsC.findIndex(a=>a.local);if(i>=0)arrowsC.splice(i,1)}   // replace the instant local arrow with the server's
   arrowsC.push(m);const o=others.get(m.by);if(o&&m.by!==myId)o.shot=m.t0}
  else if(m.t==='arrowEnd'){const i=arrowsC.findIndex(a=>a.id===m.id);if(i>=0)arrowsC.splice(i,1)}
  else if(m.t==='winner'){winnerText='🏆 '+m.name+' wins!';winnerUntil=performance.now()+5000}
  else if(m.t==='cd'){skCd[m.k]=performance.now()+m.ms}
  else if(m.t==='fx'){m.t0=performance.now();if(!(m.by===myId&&m.type==='cone'))fxs.push(m);   // my own cones are drawn instantly on key press
   if(m.by){const o=others.get(m.by);if(o&&!(m.by===myId&&o.sw&&performance.now()-o.sw.t0<500))startSwing(o,m.a,m.span,m.dur)}}
  else if(m.t==='hit'){hits.push({id:m.id,dmg:m.dmg,t0:performance.now()})}
  else if(m.t==='full')hud.textContent='Server full – try again later';
 };
}
const nameEl=document.getElementById('name');
document.getElementById('lf').onsubmit=e=>{e.preventDefault();joined=true;login.style.display='none';
 if(ws.readyState===1)ws.send(JSON.stringify({t:'join',name:nameEl.value}))};
connect();

// ---- input ----
const keys={},map={KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',ArrowUp:'w',ArrowLeft:'a',ArrowDown:'s',ArrowRight:'d'};
let rtt=60,lastSent='',atkLocal=0,myAim=0,mWx=0,mWy=0,mouseOn=false,aimSent=0,aimSentT=0;
const ATK_CD={Knight:700,Archer:800},arrowsC=[];
const angDiff=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b)),lerpAng=(a,b,t)=>a+angDiff(b,a)*t;
addEventListener('mousemove',e=>{mWx=(e.clientX*dpr-ox)/scale;mWy=(e.clientY*dpr-oy)/scale;mouseOn=true});
function updateAim(o){                          // aim = direction from the character's body to the cursor
 if(!mouseOn)return;
 const dx=mWx-o.x,dy=(mWy-(o.y-30))/0.8;
 if(dx*dx+dy*dy>64)myAim=Math.atan2(dy,dx);
 const n=performance.now();
 if(Math.abs(angDiff(myAim,aimSent))>.03&&n-aimSentT>45){aimSent=myAim;aimSentT=n;tx({t:'aim',a:+myAim.toFixed(3)})}
}
function sendInput(){const dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0),k=dx+','+dy;
 if(k!==lastSent&&ws.readyState===1){lastSent=k;ws.send(JSON.stringify({t:'input',dx,dy,a:+myAim.toFixed(3)}))}}
addEventListener('keydown',e=>{
 if(document.activeElement===chatEl){
  if(e.key==='Enter'){const t=chatEl.value.trim();if(t&&ws.readyState===1)ws.send(JSON.stringify({t:'chat',text:t}));chatEl.value='';chatEl.style.display='none';chatEl.blur()}
  else if(e.key==='Escape'){chatEl.style.display='none';chatEl.blur()}
  return}
 if(csIsOpen()){if(e.key==='Escape')csClose();return}
 if(!joined)return;
 if(e.key==='Enter'){chatEl.style.display='block';chatEl.focus();for(const k in keys)keys[k]=false;sendInput();e.preventDefault();return}
 if(!e.repeat){
  if(e.code==='KeyF'){tx(Object.assign({t:'atk',a:+myAim.toFixed(3)},atkInfo()));const n=performance.now();if(n>=atkLocal){atkLocal=n+(ATK_CD[myCls]||600);localAttack()}return}
  if(e.code==='KeyQ'||e.code==='KeyE'||e.code==='KeyR'){tx(Object.assign({t:'skill',k:e.code.slice(3),a:+myAim.toFixed(3)},atkInfo()));if(e.code==='KeyQ'&&myCls==='Knight'&&performance.now()>=skCd.Q)localCone(150,120*Math.PI/180,'rgba(255,214,107,.65)',380);return}}
 if(map[e.code]){keys[map[e.code]]=true;sendInput();e.preventDefault()}});
addEventListener('keyup',e=>{if(map[e.code]){keys[map[e.code]]=false;sendInput()}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;sendInput()});
const readyBtn=document.getElementById('readyBtn'),classBtn=document.getElementById('classBtn'),skillbar=document.getElementById('skillbar');
const tx=o=>ws.readyState===1&&ws.send(JSON.stringify(o));
setTimeout(()=>tx({t:'ping',c:performance.now()}),600);setInterval(()=>tx({t:'ping',c:performance.now()}),2000);
function atkInfo(){const o=others.get(myId);return o?{x:+o.x.toFixed(1),y:+o.y.toFixed(1),rt:Math.round(rtt)}:{rt:Math.round(rtt)}}   // my on-screen position + round-trip time
function localCone(r,span,c,dur){const o=others.get(myId);if(!o||myRole===2||o.su>0)return;
 fxs.push({type:'cone',by:myId,x:o.x,y:o.y,a:myAim,span,r,c,dur,t0:performance.now()});startSwing(o,myAim,span,dur)}
function localAttack(){const o=others.get(myId);if(!o||myRole===2||o.su>0)return;
 if(myCls==='Archer'){const n=performance.now();arrowsC.push({id:'L'+n,local:true,by:myId,x:o.x,y:o.y,a:myAim,spd:800,range:700,t0:n,adv:0});o.shot=n}
 else localCone(75,100*Math.PI/180,'rgba(255,255,255,.6)',220)}
classBtn.onclick=()=>{csOpen();classBtn.blur()};
readyBtn.onclick=()=>{tx({t:'ready'});readyBtn.blur()};

// ---- character select screen (image-based UI) ----
const IMG_W=1482,IMG_H=1002,SLOT_X=[78,261,439,619,799],SLOT_Y=[177,343,509,676],SLOT_W=157,SLOT_H=152;
const CHARS=[
 {id:'Knight',ko:'기사',img:'knight.png',stats:{hp:1000,atk:150},
  style:'Frontline bruiser. A tanky melee fighter that locks enemies down with knock-ups and slows.',
  skills:[
   {icon:'🛡️',name:'Armor',key:'PASSIVE',desc:'Reduces all damage taken by 20%.'},
   {icon:'⚔️',name:'Sword Strike',key:'Q · 8s',desc:'Wide cone slash (2x basic range): 250 dmg and 1s knock-up.'},
   {icon:'💨',name:'Guard Rush',key:'E · 12s',desc:'Take 70% less damage and gain +40% move speed for 3s.'},
   {icon:'🗡️',name:'Judgment',key:'R · 25s',desc:'8 swords ring you: 200 AoE dmg each, slows enemies 30% for 2s.'}]},
 {id:'Archer',img:'archer.png',stats:{hp:1000,atk:180},
  style:'Ranged attacker. Shoots an arrow toward the cursor every 0.8s (F). Skills coming soon.'},
 {id:'Shielder',img:'shielder.png',soon:1},
 {id:'Assassin',img:'assassin.png',soon:1},
 ...new Array(16).fill(null)
];
const csScreen=document.getElementById('csScreen'),csBox=document.getElementById('csBox');
const csPlace=(el,x,y,w,h)=>{el.style.left=x/IMG_W*100+'%';el.style.top=y/IMG_H*100+'%';el.style.width=w/IMG_W*100+'%';el.style.height=h/IMG_H*100+'%'};
const csEl=(tag,cls,parent)=>{const e=document.createElement(tag);if(cls)e.className=cls;(parent||csBox).appendChild(e);return e};
let csSel=0;
const slotEls=CHARS.map((c,i)=>{
 const b=csEl('button','csSlot'+(c?'':' lock'));csPlace(b,SLOT_X[i%5],SLOT_Y[(i/5)|0],SLOT_W,SLOT_H);
 if(c){const im=csEl('img','',b);im.src=c.img;csEl('i','eq',b).textContent='✔'}else csEl('span','',b).textContent='?';
 b.onclick=()=>{csSel=i;csRender()};return b});
const csPrev=csEl('div');csPrev.id='csPrev';csPlace(csPrev,1035,178,378,277);
const csImg=csEl('img','',csPrev),csQ=csEl('span','',csPrev);csQ.textContent='?';
const csName=csEl('div');csName.id='csName';csPlace(csName,1021,495,397,53);
const csNmL=csEl('b','',csName),csNmR=csEl('i','',csName);
const csRows=[560,632,705,778].map(y=>{
 const r=csEl('div','csSk');csPlace(r,1030,y,381,60);
 const ic=csEl('div','ic',r),tx=csEl('div','tx',r),top=csEl('div','nm',tx);
 return{ic,nm:csEl('b','',top),ky:csEl('i','',top),ds:csEl('div','ds',tx)}});
const csStyleEl=csEl('div');csStyleEl.id='csStyle';csPlace(csStyleEl,103,880,930,55);
const csOk=csEl('button');csOk.id='csOk';csPlace(csOk,1090,880,272,42);
function csFit(){csBox.style.setProperty('--u',csBox.clientWidth/IMG_W+'px')}
addEventListener('resize',csFit);
function csRender(){
 slotEls.forEach((b,i)=>{b.classList.toggle('sel',i===csSel);const q=b.querySelector('.eq');if(q)q.style.display=CHARS[i]&&CHARS[i].id===myCls?'block':'none'});
 const c=CHARS[csSel];
 csImg.style.display=c?'block':'none';csQ.style.display=c?'none':'block';if(c)csImg.src=c.img;
 csNmL.textContent=c?c.id+(c.ko?' / '+c.ko:''):'???';
 csNmR.textContent=c&&c.stats?'HP '+c.stats.hp+'   ATK '+c.stats.atk:'HP ?   ATK ?';
 const sk=(c&&c.skills)||[0,1,2,3].map(()=>({icon:'❔',name:'???',key:'',desc:c?'Details coming soon.':'Locked character.'}));
 csRows.forEach((r,i)=>{const k=sk[i];r.ic.textContent=k.icon;r.nm.textContent=k.name;r.ky.textContent=k.key;r.ds.textContent=k.desc});
 csStyleEl.textContent=c?(c.style||'Class details coming soon.'):'This slot is locked.';
 const eq=!!c&&c.id===myCls;
 csOk.textContent=!c?'LOCKED':eq?'EQUIPPED ✔':'SELECT';csOk.disabled=!c||eq;
}
csOk.onclick=()=>{const c=CHARS[csSel];if(c){tx({t:'class',cls:c.id});csClose()}};
csScreen.onclick=e=>{if(e.target===csScreen)csClose()};
document.getElementById('csClose').onclick=()=>csClose();
function csOpen(){for(const k in keys)keys[k]=false;sendInput();csScreen.style.display='flex';csFit();
 const i=CHARS.findIndex(c=>c&&c.id===myCls);csSel=i>=0?i:0;csRender()}
function csClose(){csScreen.style.display='none'}
function csIsOpen(){return csScreen.style.display==='flex'}

const CLS={Knight:['⚔️','#ffb3a7'],Archer:['🏹','#b6f0a8'],Shielder:['🛡️','#a9d4ff'],Assassin:['🗡️','#d9b3ff']};

// ---- rendering ----
function startSwing(o,a,span,dur){o.sw={t0:performance.now(),dur,a,span}}
function localSwing(span,dur){const o=others.get(myId);if(o&&myCls==='Knight'&&myRole!==2)startSwing(o,myAim,span,dur)}
function drawSword(o,h,lift){
 if(!(swordImg.complete&&swordImg.naturalWidth))return;
 const now=performance.now(),sw=o.sw,k=sw?(now-sw.t0)/sw.dur:2,cx=o.x,cy=o.y-h*.5-lift;
 ctx.save();
 if(sw&&k<1){                                   // swing: the blade sweeps across the attack cone
  const base=Math.atan2(.8*Math.sin(sw.a),Math.cos(sw.a)),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,th=base+(e-.5)*sw.span*1.15;
  ctx.translate(cx+Math.cos(th)*14,cy+Math.sin(th)*11);ctx.rotate(th+Math.PI/2);
  ctx.drawImage(swordImg,0,0,7,15,-3.5*PX,-15*PX,7*PX,15*PX);
 }else{                                         // floating "hand" sword beside the body
  const side=o.face,bob=Math.sin(now/260+o.x*.05)*3+(o.moving?Math.sin(o.phase*2)*2:0);
  ctx.translate(cx+side*32,cy+8+bob);ctx.rotate(side*.25);
  ctx.drawImage(swordImg,0,0,7,15,-3.5*PX,-11*PX,7*PX,15*PX);
 }
 ctx.restore();
}
function drawBow(o,h,lift){
 if(!(bowImg.complete&&bowImg.naturalWidth))return;
 const now=performance.now(),a=o.da||0,th=Math.atan2(.8*Math.sin(a),Math.cos(a));
 const rc=o.shot?Math.max(0,1-(now-o.shot)/180):0,bob=Math.sin(now/260+o.x*.05)*2.5+(o.moving?Math.sin(o.phase*2)*2:0);
 const dist=36-8*rc,cx=o.x+Math.cos(th)*dist,cy=o.y-h*.5-lift+8+Math.sin(th)*dist*.8+bob;
 ctx.save();ctx.translate(cx,cy);ctx.rotate(th+Math.PI);              // the bow sprite points left
 ctx.drawImage(bowImg,0,0,8,15,-4*PX,-7.5*PX,8*PX,15*PX);ctx.restore();
}
function drawArrows(t){
 if(!(arrowImg.complete&&arrowImg.naturalWidth))return;
 for(let i=arrowsC.length-1;i>=0;i--){
  const r=arrowsC[i],d=(r.adv||0)+r.spd*(t-r.t0)/1000;
  if(d>=r.range+40){arrowsC.splice(i,1);continue}
  const dd=d+28,th=Math.atan2(.8*Math.sin(r.a),Math.cos(r.a));
  ctx.save();ctx.translate(r.x+Math.cos(r.a)*dd,r.y+Math.sin(r.a)*dd*.8-30);ctx.rotate(th+Math.PI);   // the arrow sprite points left
  ctx.drawImage(arrowImg,0,0,14,3,0,-1.5*PX,14*PX,3*PX);ctx.restore();
 }
}
function drawPlayer(o,isMe){
 const lift=o.su>0?Math.sin((1-Math.min(1,o.su/1000))*Math.PI)*55:0;
 const s=Math.sin(o.phase),step=o.moving?s:0,bob=o.moving&&Math.abs(s)>.6?1:0;
 const lL=step>.3?1:0,lR=step<-.3?1:0,w=15*PX,h=15*PX,x0=o.x-w/2,yb=o.y-h-lift,sp=spriteFor(o.hue,o.cls);
 ctx.fillStyle='rgba(30,40,80,.3)';ctx.beginPath();ctx.ellipse(o.x,o.y-2,22-(bob?2:0),PX*1.3,0,0,7);ctx.fill();
 if(o.gd){ctx.save();ctx.strokeStyle='#7fd3ff';ctx.fillStyle='rgba(127,211,255,.18)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(o.x,o.y-h/2-lift,w*.5,h*.62,0,0,7);ctx.fill();ctx.stroke();ctx.restore()}
 ctx.save();ctx.translate(o.x,0);ctx.scale(o.face,1);ctx.translate(-o.x,0);
 ctx.save();ctx.translate(o.x,yb+h);ctx.rotate((o.moving?step*PX*.4:0)*.012);ctx.translate(-o.x,-(yb+h));
 ctx.drawImage(sp,0,0,15,11,x0,yb-bob*PX,w,11*PX);
 ctx.drawImage(sp,0,11,15,1,x0,yb+11*PX-bob*PX*.5,w,PX);
 ctx.restore();
 ctx.drawImage(sp,0,12,8,3,x0,yb+12*PX-lL*PX,8*PX,3*PX);
 ctx.drawImage(sp,8,12,7,3,x0+8*PX,yb+12*PX-lR*PX,7*PX,3*PX);
 ctx.restore();
 if(o.cls==='Knight')drawSword(o,h,lift);
 if(o.cls==='Archer')drawBow(o,h,lift);
 // name tag
 ctx.font='bold 15px system-ui,sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='rgba(10,20,50,.85)';
 ctx.fillStyle=isMe?'#ffe066':'#fff';ctx.strokeText(o.name||'',o.x,yb-8);ctx.fillText(o.name||'',o.x,yb-8);
 if(o.cls&&CLS[o.cls]){const t=CLS[o.cls][0]+' '+o.cls;ctx.font='bold 13px system-ui,sans-serif';ctx.lineWidth=3;
  ctx.fillStyle=CLS[o.cls][1];ctx.strokeText(t,o.x,yb-26);ctx.fillText(t,o.x,yb-26)}
 if(phase==='round'&&o.mh){const bw=46,bx=o.x-bw/2,by=o.y+8,r=Math.max(0,o.hp/o.mh);
  ctx.fillStyle='rgba(10,20,50,.85)';ctx.fillRect(bx-2,by-2,bw+4,10);
  ctx.fillStyle=r>.35?'#4cd964':'#ff5a4a';ctx.fillRect(bx,by,bw*r,6);
  if(o.sl){ctx.fillStyle='#8fd0ff';ctx.fillRect(bx,by+7,bw,2)}}
}
function drawFx(t){
 for(let i=fxs.length-1;i>=0;i--){
  const f=fxs[i],k=(t-f.t0)/f.dur;
  if(k>=1){fxs.splice(i,1);continue}
  ctx.save();ctx.translate(f.x,f.y);ctx.scale(1,.8);          // ground plane
  if(f.type==='cone'){
   ctx.globalAlpha=(1-k)*.9;ctx.beginPath();ctx.moveTo(0,0);
   ctx.arc(0,0,f.r*(.6+.4*Math.min(1,k*4)),f.a-f.span/2,f.a+f.span/2);ctx.closePath();
   ctx.fillStyle=f.c;ctx.fill();ctx.fillStyle='rgba(15,15,45,.45)';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.stroke();
   ctx.restore();
  }else{
   for(let n=0;n<f.n;n++){const a=n*Math.PI*2/f.n;
    ctx.fillStyle='#8fd0ff';ctx.fill()}ctx.arc(Math.cos(a)*f.r,Math.sin(a)*f.r,f.ar*Math.min(1,.4+k*3),0,6.2832);ctx.fillStyle='#8fd0ff';ctx.fill()}
   ctx.restore();
   for(let n=0;n<f.n;n++){const a=n*Math.PI*2/f.n,drop=Math.max(0,1-k*5)*70,bx=f.x+Math.cos(a)*f.r,by=f.y+Math.sin(a)*f.r*.8-drop;
    ctx.save();ctx.globalAlpha=Math.min(1,(1-k)*2.2);ctx.translate(bx,by);ctx.scale(1,-1);   // blade down, hilt up
    ctx.drawImage(swordImg,0,0,7,15,-3.5*4,-6,7*4,15*4);ctx.restore()}
  }
 }
}
function drawHits(t){
 for(let i=hits.length-1;i>=0;i--){
  const h=hits[i],k=(t-h.t0)/900;
  if(k>=1){hits.splice(i,1);continue}
  const o=others.get(h.id);if(!o)continue;
  const y=o.y-15*PX-40-k*34;
  ctx.globalAlpha=1-k*k;ctx.font='bold 20px system-ui,sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='rgba(60,0,0,.9)';
  ctx.fillStyle='#ffe066';ctx.strokeText('-'+h.dmg,o.x,y);ctx.fillText('-'+h.dmg,o.x,y);ctx.globalAlpha=1}
}
function updateSkillbar(t){
 if(skillbar.style.display!=='flex')return;
 for(const el of skillbar.children){const rem=Math.max(0,skCd[el.dataset.k]-t);el.classList.toggle('cd',rem>0);el.lastChild.textContent=rem>0?Math.ceil(rem/1000):''}
}
function drawBubble(o,b){
 ctx.font='14px system-ui,sans-serif';const tw=ctx.measureText(b.text).width+16,bx=o.x-tw/2,by=o.y-15*PX-68;
 ctx.fillStyle='#fff';ctx.strokeStyle='#345';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(bx,by,tw,24,8);ctx.fill();ctx.stroke();
 ctx.fillStyle='#123';ctx.textAlign='center';ctx.fillText(b.text,o.x,by+17);
}
function drawZone(){
 if(!arena)return;const rx=arena.RX*zone,ry=arena.RY*zone;
 ctx.save();ctx.fillStyle='rgba(200,30,60,.38)';
 ctx.beginPath();ctx.ellipse(arena.CX,arena.CY,arena.RX,arena.RY,0,0,6.2832);
 if(zone>0){ctx.moveTo(arena.CX+rx,arena.CY);ctx.ellipse(arena.CX,arena.CY,rx,ry,0,0,6.2832)}
 ctx.fill('evenodd');
 if(zone>0){ctx.beginPath();ctx.ellipse(arena.CX,arena.CY,rx,ry,0,0,6.2832);ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.setLineDash([14,10]);ctx.stroke()}
 ctx.restore();
}
let bannerTxt='';
function updateBanner(t){
 let b='';
 if(phase==='countdown'&&cdEnd){const r=Math.ceil((cdEnd-t)/1000);if(r>0)b='⚔️ Round starts in '+r+'…'}
 else if(phase==='round')b=myRole===2?'👁 Spectating':'Stay inside the zone!';
 else if(t<winnerUntil)b=winnerText;
 if(b!==bannerTxt){bannerTxt=b;banner.textContent=b;banner.style.display=b?'block':'none'}
}
let last=performance.now();
function frame(t){
 const dt=Math.min((t-last)/1000,.05);last=t;
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#8fc4f5';ctx.fillRect(0,0,cv.width,cv.height);
 ctx.setTransform(scale,0,0,scale,ox,oy);ctx.drawImage(bg,0,0,W,W);ctx.imageSmoothingEnabled=false;
 const k=1-Math.exp(-dt*18),list=[];
 for(const [id,o] of others){
  if(id===myId&&arena&&myRole!==2){
   // 내 캐릭터: 서버를 기다리지 않고 즉시 이동 (클라이언트 예측)
   updateAim(o);
   const stun=o.su>0,dx=stun?0:(keys.d?1:0)-(keys.a?1:0),dy=stun?0:(keys.s?1:0)-(keys.w?1:0);
   o.moving=!!(dx||dy);
   if(Math.abs(Math.cos(myAim))>.2)o.face=Math.cos(myAim)>0?1:-1;       // face the cursor side
   if(o.moving){
    const l=Math.hypot(dx,dy),spd=300*(o.gd?1.4:1)*(o.sl?.7:1);
    o.x+=dx/l*spd*dt;o.y+=dy/l*spd*dt*0.8;
    const nx=(o.x-arena.CX)/arena.RX,ny=(o.y-arena.CY)/arena.RY,d=Math.hypot(nx,ny);
    if(d>1){o.x=arena.CX+nx/d*arena.RX;o.y=arena.CY+ny/d*arena.RY}
   }
   // 서버 위치와 어긋나면 살짝 보정 (멈췄을 때, 또는 오차가 클 때)
   if(o.tx!==undefined){
    const err=Math.hypot(o.tx-o.x,o.ty-o.y);
    const c=(t<snapUntil||(!o.moving&&!o.sm))?k:(err>80?k*0.3:0);
    o.x+=(o.tx-o.x)*c;o.y+=(o.ty-o.y)*c;
   }
  }else if(o.tx!==undefined){o.x+=(o.tx-o.x)*k;o.y+=(o.ty-o.y)*k}
  o.da=id===myId?myAim:lerpAng(o.da===undefined?(o.aim||0):o.da,o.aim||0,k);
  if(o.moving)o.phase+=dt*11;else o.phase=0;
  list.push([id,o]);
 }
 list.sort((a,b)=>a[1].y-b[1].y);
 const vis=phase==='round'?list.filter(([id,o])=>o.role===1):list;
 if(phase==='round')drawZone();
 drawFx(t);
 for(const [id,o] of vis)drawPlayer(o,id===myId);
 for(const [id,o] of vis){const b=bubbles.get(id);if(b){if(t>b.until)bubbles.delete(id);else drawBubble(o,b)}}
 drawArrows(t);drawHits(t);updateSkillbar(t);
 updateBanner(t);
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
