<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky Colosseum Online</title>
<style>
html,body{margin:0;height:100%;background:#8fc4f5;overflow:hidden;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;background:rgba(20,30,60,.65);color:#fff;padding:6px 12px;border-radius:999px;font-size:13px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:rgba(20,30,60,.65);color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;white-space:nowrap}
kbd{background:#fff;color:#123;border-radius:4px;padding:1px 6px;margin:0 1px;font-weight:700}
#chat{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(58px + env(safe-area-inset-bottom,0px));width:min(360px,86vw);display:none;padding:8px 12px;border-radius:10px;border:2px solid #fff;font-size:15px;outline:none}
#login{position:fixed;inset:0;background:rgba(15,25,55,.55);display:flex;align-items:center;justify-content:center;z-index:5}
#login form{background:#fff;color:#123;padding:24px;border-radius:14px;text-align:center;width:min(300px,80vw)}
#login h1{margin:0 0 12px;font-size:20px}
#login input{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:2px solid #9ab;border-radius:8px;margin-bottom:12px}
#login button{width:100%;padding:10px;font-size:16px;border:0;border-radius:8px;background:#2196f3;color:#fff;font-weight:700;cursor:pointer}
#readyBtn{font:700 15px system-ui,sans-serif;border:2px solid #fff;border-radius:10px;color:#fff;background:rgba(20,30,60,.75);padding:10px 16px;cursor:pointer}
#readyBtn{position:fixed;left:50%;top:60%;transform:translateX(-50%);min-width:90px;font-size:18px}
#readyBtn.on{background:#2e9e4f}
#classBtn{position:fixed;right:12px;top:50%;margin-top:-25px;width:110px;height:51px;padding:0;border:0;cursor:pointer;background:url(class-btn.png?v=2) 0 0/110px 51px no-repeat;z-index:4}
#classBtn:hover{filter:brightness(1.12)}
#classMenu{position:fixed;right:132px;top:50%;margin-top:-100px;width:360px;height:200px;display:none;background:url(class-panel.png?v=2) 0 0/360px 200px no-repeat;z-index:4}
#classMenu button{position:absolute;display:block;width:130px;height:47px;margin:0;padding:0;border:0;cursor:pointer;background:url(class-option.png?v=2) 0 0/130px 47px no-repeat;color:#fff;font:700 11px 'Press Start 2P',monospace;line-height:47px;text-align:center;white-space:nowrap;text-shadow:1px 1px 0 #0044aa}
#classMenu button:nth-of-type(1){left:44px;top:48px}
#classMenu button:nth-of-type(2){left:186px;top:48px}
#classMenu button:nth-of-type(3){left:44px;top:105px}
#classMenu button:nth-of-type(4){left:186px;top:105px}
#classMenu button:hover{filter:brightness(1.15)}
#classMenu button.sel{filter:brightness(1.25) drop-shadow(0 0 3px #ffe066);color:#ffe066}
#chatLog{position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(300px,60vw);background:rgba(20,30,60,.72);color:#fff;border:2px solid #fff;border-radius:10px;font-size:13px;z-index:3;overflow:hidden}
#clHead{padding:6px 10px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.12);user-select:none;display:flex;justify-content:space-between}
#clBody{height:170px;overflow-y:auto;padding:6px 10px;line-height:1.35;word-break:break-word}
#chatLog.min #clBody{display:none}
#clBody div{margin-bottom:3px}
#clBody .sys{color:#ffe066}
#clBody .tm{opacity:.55;font-size:11px;margin-right:4px}
#banner{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:8px 20px;border-radius:12px;background:rgba(20,30,60,.75);color:#fff;font:700 20px system-ui,sans-serif;display:none;z-index:3;white-space:nowrap;border:2px solid #fff}
#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .6s;z-index:6}
#readyBtn.off{opacity:.45;cursor:not-allowed}
</style>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head><body>
<canvas id="c"></canvas>
<div id="hud">Connecting…</div>
<div id="hint">Move <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> · Chat <kbd>Enter</kbd></div>
<input id="chat" maxlength="60" placeholder="Type a message and press Enter" autocomplete="off">
<button id="classBtn" aria-label="class"></button>
<div id="classMenu">
<button data-c="Knight">Knight</button>
<button data-c="Archer">Archer</button>
<button data-c="Shielder">Shielder</button>
<button data-c="Assassin">Assassin</button>
</div>
<button id="readyBtn">0/2</button>
<div id="chatLog"><div id="clHead"><span>💬 Chat</span><span id="clArrow">▾</span></div><div id="clBody"></div></div>
<div id="banner"></div><div id="fade"></div>
<div id="login"><form id="lf"><h1>🏛️ Sky Colosseum</h1>
<input id="name" maxlength="14" placeholder="Your name" autocomplete="off"><button>Enter the arena</button></form></div>
<script>
const W=1254, PX=5;
const cv=document.getElementById('c'), ctx=cv.getContext('2d'), hud=document.getElementById('hud');
const chatEl=document.getElementById('chat'), login=document.getElementById('login');
const bg=new Image(); bg.src='bg.jpg';
const spImg=new Image(); spImg.src='player.png';
const clsImg={};for(const c of ['Knight','Archer','Shielder','Assassin']){const i=new Image();i.src=c.toLowerCase()+'.png';clsImg[c]=i}
let vw,vh,scale,ox,oy,dpr;
function resize(){dpr=devicePixelRatio||1;vw=innerWidth;vh=innerHeight;cv.width=vw*dpr;cv.height=vh*dpr;
 scale=Math.min(vw,vh)/W*dpr;ox=(cv.width-W*scale)/2;oy=(cv.height-W*scale)/2}
addEventListener('resize',resize);resize();

// ---- per-player shirt colour ----
const hsl=(h,s,l)=>{s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[f(0)*255,f(8)*255,f(4)*255]};
const cache={};
function spriteFor(hue,cls){
 const im=cls&&clsImg[cls];
 if(im&&im.complete&&im.naturalWidth)return im;
 if(cache[hue])return cache[hue];
 const c=document.createElement('canvas');c.width=15;c.height=15;const x=c.getContext('2d');x.drawImage(spImg,0,0);
 const d=x.getImageData(0,0,15,15)
 for(let i=0;i<a.length;i+=4){if(a[i+2]>200&&a[i]<60){const c2=a[i+1]>=165?li:da;a[i]=c2[0];a[i+1]=c2[1];a[i+2]=c2[2]}}
 x.putImageData(d,0,0);return cache[hue]=c;
}
// ---- chat log window ----
const CHAT_TTL=10*60*1000,clBody=document.getElementById('clBody'),chatLogEl=document.getElementById('chatLog');
const banner=document.getElementById('banner'),fade=document.getElementById('fade'),logs=[];
document.getElementById('clHead').onclick=()=>{chatLogEl.classList.toggle('min');document.getElementById('clArrow').textContent=chatLogEl.classList.contains('min')?'▸':'▾'};
function addLog(name,text,sys,age){
 const at=Date.now()-(age||0),d=new Date(at),el=document.createElement('div'),tm=document.createElement('span');
 tm.className='tm';tm.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
 el.append(tm,sys?text:name+': '+text);if(sys)el.className='sys';
 const stick=clBody.scrollTop+clBody.clientHeight>=clBody.scrollHeight-20;
 clBody.appendChild(el);logs.push({at,el});
 if(stick)clBody.scrollTop=clBody.scrollHeight;
}
setInterval(()=>{const lim=Date.now()-CHAT_TTL;while(logs.length&&logs[0].at<lim)logs.shift().el.remove()},5000);
function flash(){fade.style.transition='none';fade.style.opacity=.9;requestAnimationFrame(()=>requestAnimationFrame(()=>{fade.style.transition='opacity .6s';fade.style.opacity=0}))}
// ---- networking ----
let ws,myId=null,joined=false,snapUntil=0,arena=null;
let phase='lobby',zone=1,myRole=0,snapNext=false,cdEnd=0,winnerText='',winnerUntil=0;
const others=new Map(),bubbles=new Map();
function connect(){
 ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
 ws.onopen=()=>{hud.textContent='Connected';if(joined)ws.send(JSON.stringify({t:'join',name:nameEl.value}))};
 ws.onclose=()=>{hud.textContent='Disconnected – reconnecting…';others.clear();setTimeout(connect,1500)};
 ws.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.t==='hello'){myId=m.id;arena=m.arena}
  else if(m.t==='history'){clBody.innerHTML='';logs.length=0;for(const c of m.log)addLog(c.name,c.text,c.sys,c.age)}
  else if(m.t==='state'){
   phase=m.ph;zone=m.z;
   const seen=new Set();
   for(const p of m.p){
    seen.add(p.id);
    let o=others.get(p.id);
    if(!o){o={x:p.x,y:p.y,phase:0,face:p.f};others.set(p.id,o)}
    if(snapNext){o.x=p.x;o.y=p.y}
    Object.assign(o,{tx:p.x,ty:p.y,name:p.name,hue:p.hue,moving:p.m,sm:p.m,face:p.f,cls:p.c,ready:p.r,role:p.o});
   }
   snapNext=false;
   for(const id of others.keys())if(!seen.has(id))others.delete(id);
   const me=m.p.find(p=>p.id===myId),total=m.p.length,rc=m.p.filter(p=>p.r).length;
   myRole=me?me.o:0;
   hud.textContent=phase==='round'?'Round in progress · alive: '+m.p.filter(p=>p.o===1).length:'Players online: '+total;
   readyBtn.style.display=phase==='lobby'?'':'none';
   readyBtn.textContent=rc+'/'+Math.max(total,2);
   readyBtn.classList.toggle('off',total<2);
   readyBtn.classList.toggle('on',!!(me&&me.r));
   classMenu.querySelectorAll('button').forEach(b=>b.classList.toggle('sel',!!me&&me.c===b.dataset.c));
  }
  else if(m.t==='chat'){addLog(m.name,m.text,m.sys,0);if(m.id)bubbles.set(m.id,{text:m.text,until:performance.now()+4000})}
  else if(m.t==='countdown'){cdEnd=m.ms?performance.now()+m.ms:0}
  else if(m.t==='tp'){snapNext=true;flash()}
  else if(m.t==='winner'){winnerText='🏆 '+m.name+' wins!';winnerUntil=performance.now()+5000}
  else if(m.t==='full')hud.textContent='Server full – try again later';
 };
}
const nameEl=document.getElementById('name');
document.getElementById('lf').onsubmit=e=>{e.preventDefault();joined=true;login.style.display='none';
 if(ws.readyState===1)ws.send(JSON.stringify({t:'join',name:nameEl.value}))};
connect();

// ---- input ----
const keys={},map={KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',ArrowUp:'w',ArrowLeft:'a',ArrowDown:'s',ArrowRight:'d'};
let lastSent='';
function sendInput(){const dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0),k=dx+','+dy;
 if(k!==lastSent&&ws.readyState===1){lastSent=k;ws.send(JSON.stringify({t:'input',dx,dy}))}}
addEventListener('keydown',e=>{
 if(document.activeElement===chatEl){
  if(e.key==='Enter'){const t=chatEl.value.trim();if(t&&ws.readyState===1)ws.send(JSON.stringify({t:'chat',text:t}));chatEl.value='';chatEl.style.display='none';chatEl.blur()}
  else if(e.key==='Escape'){chatEl.style.display='none';chatEl.blur()}
  return}
 if(!joined)return;
 if(e.key==='Enter'){chatEl.style.display='block';chatEl.focus();for(const k in keys)keys[k]=false;sendInput();e.preventDefault();return}
 if(map[e.code]){keys[map[e.code]]=true;sendInput();e.preventDefault()}});
addEventListener('keyup',e=>{if(map[e.code]){keys[map[e.code]]=false;sendInput()}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;sendInput()});
const readyBtn=document.getElementById('readyBtn'),classBtn=document.getElementById('classBtn'),classMenu=document.getElementById('classMenu');
const tx=o=>ws.readyState===1&&ws.send(JSON.stringify(o));
classBtn.onclick=()=>{classMenu.style.display=classMenu.style.display==='flex'?'none':'flex';classBtn.blur()};
classMenu.querySelectorAll('button').forEach(b=>b.onclick=()=>{tx({t:'class',cls:b.dataset.c});classMenu.style.display='none';b.blur()});
readyBtn.onclick=()=>{tx({t:'ready'});readyBtn.blur()};

const CLS={Knight:['⚔️','#ffb3a7'],Archer:['🏹','#b6f0a8'],Shielder:['🛡️','#a9d4ff'],Assassin:['🗡️','#d9b3ff']};

// ---- rendering ----
function drawPlayer(o,isMe){
 const s=Math.sin(o.phase),step=o.moving?s:0,bob=o.moving&&Math.abs(s)>.6?1:0;
 const lL=step>.3?1:0,lR=step<-.3?1:0,w=15*PX,h=15*PX,x0=o.x-w/2,yb=o.y-h,sp=spriteFor(o.hue,o.cls);
 ctx.fillStyle='rgba(30,40,80,.3)';ctx.beginPath();ctx.ellipse(o.x,o.y-2,22-(bob?2:0),PX*1.3,0,0,7);ctx.fill();
 ctx.save();ctx.translate(o.x,0);ctx.scale(o.face,1);ctx.translate(-o.x,0);
 ctx.save();ctx.translate(o.x,yb+h);ctx.rotate((o.moving?step*PX*.4:0)*.012);ctx.translate(-o.x,-(yb+h));
 ctx.drawImage(sp,0,0,15,11,x0,yb-bob*PX,w,11*PX);
 ctx.drawImage(sp,0,11,15,1,x0,yb+11*PX-bob*PX*.5,w,PX);
 ctx.restore();
 ctx.drawImage(sp,0,12,8,3,x0,yb+12*PX-lL*PX,8*PX,3*PX);
 ctx.drawImage(sp,8,12,7,3,x0+8*PX,yb+12*PX-lR*PX,7*PX,3*PX);
 ctx.restore();
 // name tag
 ctx.font='bold 15px system-ui,sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='rgba(10,20,50,.85)';
 ctx.fillStyle=isMe?'#ffe066':'#fff';ctx.strokeText(o.name||'',o.x,yb-8);ctx.fillText(o.name||'',o.x,yb-8);
 if(o.cls&&CLS[o.cls]){const t=CLS[o.cls][0]+' '+o.cls;ctx.font='bold 13px system-ui,sans-serif';ctx.lineWidth=3;
  ctx.fillStyle=CLS[o.cls][1];ctx.strokeText(t,o.x,yb-26);ctx.fillText(t,o.x,yb-26)}
}
function drawBubble(o,b){
 ctx.font='14px system-ui,sans-serif';const tw=ctx.measureText(b.text).width+16,bx=o.x-tw/2,by=o.y-15*PX-68;
 ctx.fillStyle='#fff';ctx.strokeStyle='#345';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(bx,by,tw,24,8);ctx.fill();ctx.stroke();
 ctx.fillStyle='#123';ctx.textAlign='center';ctx.fillText(b.text,o.x,by+17);
}
function drawZone(){
 if(!arena)return;const rx=arena.RX*zone,ry=arena.RY*zone;
 ctx.save();ctx.fillStyle='rgba(200,30,60,.38)';
 ctx.beginPath();ctx.ellipse(arena.CX,arena.CY,arena.RX,arena.RY,0,0,6.2832);
 if(zone>0){ctx.moveTo(arena.CX+rx,arena.CY);ctx.ellipse(arena.CX,arena.CY,rx,ry,0,0,6.2832)}
 ctx.fill('evenodd');
 if(zone>0){ctx.beginPath();ctx.ellipse(arena.CX,arena.CY,rx,ry,0,0,6.2832);ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.setLineDash([14,10]);ctx.stroke()}
 ctx.restore();
}
let bannerTxt='';
function updateBanner(t){
 let b='';
 if(phase==='countdown'&&cdEnd){const r=Math.ceil((cdEnd-t)/1000);if(r>0)b='⚔️ Round starts in '+r+'…'}
 else if(phase==='round')b=myRole===2?'👁 Spectating':'Stay inside the zone!';
 else if(t<winnerUntil)b=winnerText;
 if(b!==bannerTxt){bannerTxt=b;banner.textContent=b;banner.style.display=b?'block':'none'}
}
let last=performance.now();
function frame(t){
 const dt=Math.min((t-last)/1000,.05);last=t;
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#8fc4f5';ctx.fillRect(0,0,cv.width,cv.height);
 ctx.setTransform(scale,0,0,scale,ox,oy);ctx.drawImage(bg,0,0,W,W);ctx.imageSmoothingEnabled=false;
 const k=1-Math.exp(-dt*18),list=[];
 for(const [id,o] of others){
  if(id===myId&&arena&&myRole!==2){
   // 내 캐릭터: 서버를 기다리지 않고 즉시 이동 (클라이언트 예측)
   const dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0);
   o.moving=!!(dx||dy);
   if(o.moving){
    const l=Math.hypot(dx,dy);
    o.x+=dx/l*300*dt;o.y+=dy/l*300*dt*0.8;
    if(dx)o.face=dx>0?1:-1;
    const nx=(o.x-arena.CX)/arena.RX,ny=(o.y-arena.CY)/arena.RY,d=Math.hypot(nx,ny);
    if(d>1){o.x=arena.CX+nx/d*arena.RX;o.y=arena.CY+ny/d*arena.RY}
   }
   // 서버 위치와 어긋나면 살짝 보정 (멈췄을 때, 또는 오차가 클 때)
   if(o.tx!==undefined){
    const err=Math.hypot(o.tx-o.x,o.ty-o.y);
    const c=(t<snapUntil||(!o.moving&&!o.sm))?k:(err>80?k*0.3:0);
    o.x+=(o.tx-o.x)*c;o.y+=(o.ty-o.y)*c;
   }
  }else if(o.tx!==undefined){o.x+=(o.tx-o.x)*k;o.y+=(o.ty-o.y)*k}
  if(o.moving)o.phase+=dt*11;else o.phase=0;
  list.push([id,o]);
 }
 list.sort((a,b)=>a[1].y-b[1].y);
 const vis=phase==='round'?list.filter(([id,o])=>o.role===1):list;
 if(phase==='round')drawZone();
 for(const [id,o] of vis)drawPlayer(o,id===myId);
 for(const [id,o] of vis){const b=bubbles.get(id);if(b){if(t>b.until)bubbles.delete(id);else drawBubble(o,b)}}
 updateBanner(t);
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
