const towerImg=new Image(),tInfImg=new Image(),tArcImg=new Image(),cbImg=new Image();towerImg.src='tower.png';tInfImg.src='towerinfantry.png';const stkImg=new Image();stkImg.src='stock.png';tArcImg.src='towerarcher.png';cbImg.src='cannonball.png';

const kshImg=new Image();kshImg.src='knightshield.png';

const daggerImg=new Image();daggerImg.src='assassin-sword.png',slashImg=new Image(),orbImg=new Image(),fireImg=new Image(),charmImg=new Image();
slashImg.src='slash.png';orbImg.src='orb.png';fireImg.src='foxfire.png';charmImg.src='charm.png';

for(const [k,f] of [['Lucifer','luciferCharacter.png'],['Lucifer:a','angelForm.png'],['Lucifer:d','devilForm.png'],['Gamer','gamer.png'],['Celestial','astro.png']]){const i=new Image();i.src=f;clsImg[k]=i}
const gMelWImg=new Image(),gRngWImg=new Image(),gSlashImg=new Image(),grImg=new Image(),gachaImg=new Image();gMelWImg.src='gamerMeleeAttackWeapon.png';gRngWImg.src='gamerRangedAttackWeapon.png';gSlashImg.src='gamerMeleeAttack.png';grImg.src='gamerRangedAttack.png';gachaImg.src='gacha.png';
const lsImg=new Image(),fsImg=new Image(),crImg=new Image(),fbImg=new Image(),hfImg=new Image(),lgImg=new Image(),wlImg=new Image(),wrImg=new Image();
lsImg.src='lightshot.png';fsImg.src='fireshot.png';crImg.src='crystal.png';fbImg.src='flamebomb.png';hfImg.src='holyfield.png';lgImg.src='light.png';wlImg.src='angelForm_s_left_wing.png';wrImg.src='angelForm_s_right_wing.png';

// ---- per-player shirt colour ----
const hsl=(h,s,l)=>{s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[f(0)*255,f(8)*255,f(4)*255]};
const cache={},blankSp=document.createElement('canvas');blankSp.width=blankSp.height=15;
function spriteFor(hue,cls,form){
 const im=cls&&clsImg[form?cls+':'+form:cls];
 if(im&&im.complete&&im.naturalWidth)return im;
 if(!(spImg.complete&&spImg.naturalWidth))return blankSp;
 if(cache[hue])return cache[hue];
 const c=document.createElement('canvas');c.width=15;c.height=15;const x=c.getContext('2d');x.drawImage(spImg,0,0);
 const d=x.getImageData(0,0,15,15),a=d.data,li=hsl(hue,85,55),da=hsl(hue,85,42);
 for(let i=0;i<a.length;i+=4){if(a[i+2]>200&&a[i]<60){const c2=a[i+1]>=165?li:da;a[i]=c2[0];a[i+1]=c2[1];a[i+2]=c2[2]}}
 x.putImageData(d,0,0);return cache[hue]=c;
}
// ---- chat log window ----
const CHAT_TTL=10*60*1000,clBody=document.getElementById('clBody'),chatLogEl=document.getElementById('chatLog');

document.getElementById('clHead').onclick=()=>{chatLogEl.classList.toggle('min');document.getElementById('clArrow').textContent=chatLogEl.classList.contains('min')?'▸':'▾'};
function addLog(name,text,sys,age){
 const at=Date.now()-(age||0),d=new Date(at),el=document.createElement('div'),tm=document.createElement('span');
 tm.className='tm';tm.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
 el.append(tm,sys?text:name+': '+text);if(sys)el.className='sys';
 const stick=clBody.scrollTop+clBody.clientHeight>=clBody.scrollHeight-20;
 clBody.appendChild(el);logs.push({at,el});
 if(stick)clBody.scrollTop=clBody.scrollHeight;
}
setInterval(()=>{const lim=Date.now()-CHAT_TTL;while(logs.length&&logs[0].at<lim)logs.shift().el.remove()},5000);
function flash(){fade.style.transition='none';fade.style.opacity=.9;requestAnimationFrame(()=>requestAnimationFrame(()=>{fade.style.transition='opacity .6s';fade.style.opacity=0}))}
const killLogEl=document.getElementById('killLog');

 if(m.k){el.append(ic(m.kc)+m.kn+' ');const s=document.createElement('b');s.textContent='⚔';el.append(s,' '+ic(m.vc)+m.vn)}else el.append(ic(m.vc)+m.vn+' 탈락');
 if(m.k===myId||m.v===myId)el.style.borderColor='#ffe066';
 killLogEl.appendChild(el);while(killLogEl.children.length>5)killLogEl.firstChild.remove();
 setTimeout(()=>{el.style.opacity=0;setTimeout(()=>el.remove(),500)},6000)}
// ---- networking ----
let ws,myId=null,joined=false,snapUntil=0,arena=null;
let phase='lobby',roundLeft=0,myRole=0,snapNext=false,cdEnd=0,winnerText='',winnerUntil=0,myCls='',myForm='';
let gcS={l:[],s:1,ch:0},celS={d:0,b:0};const skCd={Q:0,E:0,R:0},fxs=[],hits=[];let rv={n:0,i:0,live:0,blank:0,rlEnd:0};let stk={id:0,name:'',pl:0,hist:[]};
let isAdmin=false,myTitles=[],myEq=null;const titleMap=new Map();
const others=new Map(),bubbles=new Map();
function connect(){
 ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
 ws.onopen=()=>{hud.textContent='Connected';const tk=lsGet();if(tk&&!kicked){authBusy=true;authErr.textContent='자동 로그인 중…';ws.send(JSON.stringify({t:'resume',token:tk}))}};
 ws.onclose=()=>{hud.textContent='Disconnected – reconnecting…';others.clear();titleMap.clear();authBusy=false;authGo.disabled=false;setTimeout(connect,1500)};
 ws.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.t==='hello'){myId=m.id;arena=m.arena;mapId=m.map||0;bg=bgs[mapId]}
  else if(m.t==='map'){arena=m.arena;mapId=m.id;bg=bgs[mapId];snapNext=true}
  else if(m.t==='history'){clBody.innerHTML='';logs.length=0;for(const c of m.log)addLog(c.name,c.text,c.sys,c.age)}
  else if(m.t==='state'){
   phase=m.ph;roundLeft=m.left;foxes=m.ff||[];
   const seen=new Set();
   for(const p of m.p){
    seen.add(p.id);
    let o=others.get(p.id);
    if(!o){o={x:p.x,y:p.y,phase:0,face:p.f};others.set(p.id,o)}
    if(snapNext){o.x=p.x;o.y=p.y}
    const f0=o.face;
    if(p.su>0&&(p.su>(o.su||0)+60||!(o.su>0)))o.sMax=p.su;
    Object.assign(o,{tx:p.x,ty:p.y,name:p.name,hue:p.hue,moving:p.m,sm:p.m,face:p.f,aim:p.a,cls:p.c,ready:p.r,role:p.o,hp:p.hp,mh:p.mh,su:p.su,gd:p.gd,sl:p.sl,hs:p.hs,iv:p.iv,cg:p.cg,hn:p.hn,ta:p.ta,kb:p.kb,ds:p.ds,mk:p.mk,as:p.as,cm:p.cm,bn:p.bn,qn:p.qn,lf:p.lf,lb:p.lb,dm:p.dm,rl:p.rl,mt:p.mt,gb:p.gb,fs:p.fs,sa:p.sa,sk:p.sk,ut:p.ut,ow:p.ow,tr:p.tr,ins:p.ins,dp:p.dp,gm:p.gm,gt:p.gt,id:p.id});
    if(p.id===myId)o.face=f0;
   }
   snapNext=false;
   for(const id of others.keys())if(!seen.has(id))others.delete(id);
   for(const id of titleMap.keys())if(!seen.has(id))titleMap.delete(id);
   const me=m.p.find(p=>p.id===myId),total=m.p.filter(p=>!p.ut).length,rc=m.p.filter(p=>p.r).length;
   myRole=me?me.o:0;
   hud.textContent=phase==='round'?'Round in progress · alive: '+m.p.filter(p=>p.o===1&&!p.ut).length:'Players online: '+total;
   readyBtn.style.display=phase==='lobby'?'':'none';
   readyBtn.textContent=rc+'/'+Math.max(total,2);
   readyBtn.classList.toggle('off',total<2);
   readyBtn.classList.toggle('on',!!(me&&me.r));
   if(myCls!==(me?me.c:'')){myCls=me?me.c:'';csRender();skIcons()}
    const fm=(me&&me.lf)||'';if(fm!==myForm){myForm=fm;skIcons()}
   titleBtn.style.display=shopBtn.style.display=phase==='lobby'?'':'none';
   mapBtn.style.display=(phase==='lobby'&&isAdmin&&!obs)?'':'none';mapBtn.textContent='🗺 맵 '+(mapId+1)+'/'+MAPS.length;classBtn.style.display=(phase==='lobby'||myRole===2||obs)?'':'none';logoutBtn.style.display=phase==='lobby'?'block':'none';
   if(phase!=='lobby'){if(csIsOpen()&&myRole!==2&&!obs)csClose();ttClose();admClose();shopClose()}
   skillbar.style.display=(SKB[myCls]&&myRole!==2)?'flex':'none';
   goldBar.style.display=(joined&&!obs)?'block':'none';
   if(obs){readyBtn.style.display=titleBtn.style.display=shopBtn.style.display=skillbar.style.display='none';shopClose();classBtn.style.display='';logoutBtn.style.display='block'}
  }
  else if(m.t==='chat'){addLog(m.name,m.text,m.sys,0);if(m.id)bubbles.set(m.id,{text:m.text,until:performance.now()+4000})}
  else if(m.t==='countdown'){cdEnd=m.ms?performance.now()+m.ms:0}
  else if(m.t==='tp'){snapNext=true;arrowsC.length=0;chargeT0=0;hasteLocal=0;flash()}
  else if(m.t==='warp'){const o=others.get(myId);if(o){o.x=o.tx=m.x;o.y=o.ty=m.y}}
  else if(m.t==='pong'){rtt=rtt*.6+(performance.now()-m.c)*.4}
  else if(m.t==='arrow'){m.t0=performance.now();
   if(m.by===myId&&(m.kd==='atk'||m.kd==='orb')){const i=arrowsC.findIndex(a=>a.local);if(i>=0)arrowsC.splice(i,1)}
   arrowsC.push(m);const o=others.get(m.by);if(o&&(m.by!==myId||m.kd!=='atk'))o.shot=m.t0}
  else if(m.t==='arrowEnd'){const i=arrowsC.findIndex(a=>a.id===m.id);if(i>=0)arrowsC.splice(i,1)}
  else if(m.t==='winner'){winnerText=m.second?'⏱ 시간 제한! 2nd place: '+m.name:'🏆 '+m.name+' 승리!';winnerUntil=performance.now()+5000}
  else if(m.t==='cd'){skCd[m.k]=performance.now()+m.ms}
  else if(m.t==='cel'){celS={d:m.d,b:m.b}}
  else if(m.t==='gold'){goldSet(m.g,m.d)}
  else if(m.t==='gc'){gcS={l:m.l,s:m.s,ch:performance.now()+m.ch}}
  else if(m.t==='fx'){m.t0=performance.now();if(m.g){const go=others.get(m.g);if(go)go.shot=m.t0}if(!(m.by===myId&&(m.type==='cone'||m.type==='gslash')&&!m.tint))fxs.push(m);
   if(m.by){const o=others.get(m.by);if(o&&!(m.by===myId&&o.sw&&performance.now()-o.sw.t0<500))startSwing(o,m.a,m.span,m.dur)}}
  else if(m.t==='rv'){rv={n:m.n,i:m.i,live:m.live,blank:m.blank,rlEnd:m.rl?performance.now()+m.rl:0}}
  else if(m.t==='stk'){if(!m.id)stk={id:0,name:'',pl:0,hist:[]};else{if(stk.id!==m.id)stk={id:m.id,name:m.n||'',pl:m.pl,hist:[]};stk.pl=m.pl;stk.hist.push(m.pl);if(stk.hist.length>90)stk.hist.shift()}}
  else if(m.t==='kill')addKill(m);
  else if(m.t==='hit'){hits.push({id:m.id,dmg:m.dmg,bl:m.bl,t0:performance.now()})}
  else if(m.t==='tinfo'){myTitles=m.list||[];myEq=m.eq||null;ttRender()}
  else if(m.t==='ttl'){if(m.tt)titleMap.set(m.id,m.tt);else titleMap.delete(m.id)}
  else if(m.t==='ttls'){titleMap.clear();for(const k in m.m)titleMap.set(+k,m.m[k])}
  else if(m.t==='tadmin')admReply(m);
  else if(m.t==='auth'){authBusy=false;authGo.disabled=false;
   if(m.ok){joined=true;obs=!!m.obs;document.getElementById('hint').style.display=obs?'none':'';isAdmin=!!m.admin;if(m.token)lsSet(m.token);login.style.display='none';pwEl.value='';authErr.textContent=''}
   else{joined=false;obs=false;resetTitles();login.style.display='flex';if(m.resume){lsDel();authErr.textContent=''}else authErr.textContent=m.err||'오류가 발생했습니다.'}}
  else if(m.t==='kicked'){kicked=true;joined=false;obs=false;resetTitles();others.clear();logoutBtn.style.display='none';login.style.display='flex';authErr.textContent='다른 곳에서 로그인하여 접속이 종료되었습니다.'}
  else if(m.t==='full')hud.textContent='Server full – try again later';
 };
}
// ---- login / sign-up (accounts are stored server-side in Upstash; the browser only keeps a session token) ----
const TOKEN_KEY='mpvp_token',nameEl=document.getElementById('name'),uidEl=document.getElementById('uid'),pwEl=document.getElementById('upw');
const authErr=document.getElementById('authErr'),authHint=document.getElementById('authHint'),authGo=document.getElementById('authGo');
const tabLogin=document.getElementById('tabLogin'),tabSignup=document.getElementById('tabSignup'),logoutBtn=document.getElementById('logoutBtn');
let authMode='login',authBusy=false,kicked=false,obs=false;
const lsGet=()=>{try{return localStorage.getItem(TOKEN_KEY)}catch(e){return null}};
const lsSet=v=>{try{localStorage.setItem(TOKEN_KEY,v)}catch(e){}};
const lsDel=()=>{try{localStorage.removeItem(TOKEN_KEY)}catch(e){}};
function setAuthMode(m){authMode=m;const su=m==='signup';
 nameEl.style.display=authHint.style.display=su?'':'none';authGo.textContent=su?'회원가입':'로그인';
 pwEl.autocomplete=su?'new-password':'current-password';tabLogin.classList.toggle('on',!su);tabSignup.classList.toggle('on',su);authErr.textContent=''}
tabLogin.onclick=()=>setAuthMode('login');tabSignup.onclick=()=>setAuthMode('signup');setAuthMode('login');
document.getElementById('lf').onsubmit=e=>{e.preventDefault();if(authBusy)return;
 const id=uidEl.value.trim().toLowerCase(),pw=pwEl.value,su=authMode==='signup';
 if(!id||!pw){authErr.textContent='아이디와 비밀번호를 입력해 주세요.';return}
 if(su&&nameEl.value.trim().length<2){authErr.textContent='닉네임은 2자 이상 입력해 주세요.';return}
 if(ws.readyState!==1){authErr.textContent='서버에 연결 중입니다. 잠시 후 다시 시도해 주세요.';return}
 kicked=false;authBusy=true;authGo.disabled=true;authErr.textContent='';
 ws.send(JSON.stringify(su?{t:'signup',id,pw,name:nameEl.value}:{t:'login',id,pw}))};
logoutBtn.onclick=()=>{const tk=lsGet();lsDel();joined=false;if(ws.readyState===1)ws.send(JSON.stringify({t:'logout',token:tk}));setTimeout(()=>location.reload(),150)};
connect();

// ---- input ----
const keys={},map={KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',ArrowUp:'w',ArrowLeft:'a',ArrowDown:'s',ArrowRight:'d'};
let chargeT0=0,hasteLocal=0;const CHARGE_MS=2000;
let foxes=[],ghosts=[],toastT=0;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{el.style.display='none'},1500)}
let rtt=60,lastSent='',atkLocal=0,myAim=0,mWx=0,mWy=0,mouseOn=false,aimSent=0,aimSentT=0;
const ATK_CD={Knight:700,Archer:800,Shielder:800,Assassin:600,Gumiho:700,Lucifer:900,Gambler:600,SwordMaster:600,Tower:2000,Financier:900,Gamer:700,Celestial:800},arrowsC=[];
const angDiff=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b)),lerpAng=(a,b,t)=>a+angDiff(b,a)*t;
let mcx=0,mcy=0,camX=W/2,camY=W/2;
addEventListener('mousemove',e=>{mcx=e.clientX;mcy=e.clientY;mWx=(mcx*dpr-ox)/scale;mWy=(mcy*dpr-oy)/scale;mouseOn=true});
function updateAim(o){
 if(!mouseOn)return;
 const dx=mWx-o.x,dy=(mWy-(o.y-30))/0.8;
 if(dx*dx+dy*dy>64)myAim=Math.atan2(dy,dx);
 const n=performance.now();
 if(Math.abs(angDiff(myAim,aimSent))>.03&&n-aimSentT>45){aimSent=myAim;aimSentT=n;tx({t:'aim',a:+myAim.toFixed(3)})}
}
function sendInput(){const dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0),k=dx+','+dy;
 if(k!==lastSent&&ws.readyState===1){lastSent=k;ws.send(JSON.stringify({t:'input',dx,dy,a:+myAim.toFixed(3)}))}}
addEventListener('keydown',e=>{
 if(document.activeElement===chatEl){
  if(e.key==='Enter'){const t=chatEl.value.trim();if(t&&ws.readyState===1)ws.send(JSON.stringify({t:'chat',text:t}));chatEl.value='';chatEl.style.display='none';chatEl.blur()}
  else if(e.key==='Escape'){chatEl.style.display='none';chatEl.blur();closeAllWins()}
  return}
 if(anyWinOpen()){if(e.key==='Escape')closeAllWins();return}
 if(!joined||obs)return;
 if(e.key==='Enter'){chatEl.style.display='block';chatEl.focus();for(const k in keys)keys[k]=false;sendInput();cancelCharge();e.preventDefault();return}
 if(!e.repeat){
  if(e.code==='KeyF'){if(myCls==='Archer'){archerPress();return}

 updateRv(t);updateStk();updateGc(t);updateCel();
 if(skillbar.style.display!=='flex')return;
 const me=others.get(myId),hs=!!(me&&myCls==='Archer'&&hasteOn(me)),hn=!!(me&&myCls==='Shielder'&&me.hn);
 for(const el of skillbar.children){el.classList.toggle('on',(hs&&el.dataset.k==='E')||(hn&&el.dataset.k==='R'));const rem=Math.max(0,skCd[el.dataset.k]-t);el.classList.toggle('cd',rem>0);el.lastChild.textContent=rem>0?Math.ceil(rem/1000):''}
}
function drawBubble(o,b){
 ctx.font='14px system-ui,sans-serif';const tw=ctx.measureText(b.text).width+16,bx=o.x-tw/2,by=o.y-15*PX-68-(o.tt?18:0);
 ctx.fillStyle='#fff';ctx.strokeStyle='#345';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(bx,by,tw,24,8);ctx.fill();ctx.stroke();
 ctx.fillStyle='#123';ctx.textAlign='center';ctx.fillText(b.text,o.x,by+17);
}
function drawZone(){
 if(!arena)return;const rx=arena.RX*zone,ry=arena.RY*zone;
 ctx.save();ctx.fillStyle='rgba(200,30,60,.38)';
 ctx.beginPath();ctx.ellipse(arena.CX,arena.CY,arena.RX,arena.RY,0,0,6.2832);
 if(zone>0){ctx.moveTo(arena.CX+rx,arena.CY);ctx.ellipse(arena.CX,arena.CY,rx,ry,0,0,6.2832)}
 ctx.fill('evenodd');
 if(zone>0){ctx.beginPath();ctx.ellipse(arena.CX,arena.CY,rx,ry,0,0,6.2832);ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.setLineDash([14,10]);ctx.stroke()}
 ctx.restore();
}
let bannerTxt='';
function updateBanner(t){
 let b='';
 if(phase==='countdown'&&cdEnd){const r=Math.ceil((cdEnd-t)/1000);if(r>0)b='⚔️ Round starts in '+r+'…'}
 else if(phase==='round'){const s=Math.ceil(roundLeft/1000);b=(myRole===2?'👁 관전자 수  ':'')+'⏱ '+(s/60|0)+':'+String(s%60).padStart(2,'0')}
 else if(t<winnerUntil)b=winnerText;
 if(b!==bannerTxt){bannerTxt=b;banner.textContent=b;banner.style.display=b?'block':'none'}
}
let last=performance.now();
function frame(t){requestAnimationFrame(frame);
 try{draw(t)}catch(e){console.error(e);if(ctx.reset)ctx.reset()}}
function draw(t){
 const dt=Math.min((t-last)/1000,.05);last=t;
 ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.setLineDash([]);ctx.fillStyle='#8fc4f5';ctx.fillRect(0,0,cv.width,cv.height);
  {const me=others.get(myId),fx=me&&myRole!==2?me.x:W/2,fy=me&&myRole!==2?me.y-30:W/2,sw=W*scale,sh=W*scale,kc=Math.min(1,dt*10);
  camX+=(fx-camX)*kc;camY+=(fy-camY)*kc;
  ox=sw>cv.width+1?Math.max(cv.width-sw,Math.min(0,cv.width/2-camX*scale)):(cv.width-sw)/2;
  oy=sh>cv.height+1?Math.max(cv.height-sh,Math.min(0,cv.height/2-camY*scale)):(cv.height-sh)/2;
  mWx=(mcx*dpr-ox)/scale;mWy=(mcy*dpr-oy)/scale}
 ctx.setTransform(scale,0,0,scale,ox,oy);if(imOk(bg))ctx.drawImage(bg,0,0,W,W);ctx.imageSmoothingEnabled=false;
 const k=1-Math.exp(-dt*18),list=[];
 for(const [id,o] of others){
  if(id===myId&&arena&&myRole!==2){

   updateAim(o);
   const stun=o.su>0,forced=stun||o.ta||o.kb||o.ds||o.cm;if(chargeT0&&stun)chargeT0=0;
   const dx=forced?0:(keys.d?1:0)-(keys.a?1:0),dy=forced?0:(keys.s?1:0)-(keys.w?1:0);
   o.moving=!!(dx||dy);
   if(Math.abs(Math.cos(myAim))>.2)o.face=Math.cos(myAim)>0?1:-1;
   if(o.moving){
    const l=Math.hypot(dx,dy),spd=300*(o.gd?1.15:1)*(o.sl?.7:1)*(o.hn?.85:1)*(o.cls==='Assassin'&&o.iv?1.15:1)*(o.lb?1.2:1)*(o.fs?1.2:1);
    o.x+=dx/l*spd*dt;o.y+=dy/l*spd*dt*0.8;
    const nx=(o.x-arena.CX)/arena.RX,ny=(o.y-arena.CY)/arena.RY,d=Math.hypot(nx,ny);
    if(d>1){o.x=arena.CX+nx/d*arena.RX;o.y=arena.CY+ny/d*arena.RY}
   }

   if(o.tx!==undefined){
    const err=Math.hypot(o.tx-o.x,o.ty-o.y);
    const c=(t<snapUntil||forced||(!o.moving&&!o.sm))?(o.ds?1-Math.exp(-dt*45):k):(err>80?k*0.3:0);
    o.x+=(o.tx-o.x)*c;o.y+=(o.ty-o.y)*c;
   }
  }else if(o.tx!==undefined){o.x+=(o.tx-o.x)*k;o.y+=(o.ty-o.y)*k}
  o.chg=o.cls!=='Archer'?-1:id===myId?(chargeT0?Math.min(1,(t-chargeT0)/chMax(o)):-1):(o.cg>0?Math.min(1,o.cg/CHARGE_MS):-1);
  if(id===myId&&chargeT0&&myRole===2)chargeT0=0;
  o.tt=titleMap.get(id)||null;
  o.da=id===myId?myAim:lerpAng(o.da===undefined?(o.aim||0):o.da,o.aim||0,k);
  if(o.moving)o.phase+=dt*11;else o.phase=0;
  list.push([id,o]);
 }
 list.sort((a,b)=>a[1].y-b[1].y);
 const vis=(phase==='round'?list.filter(([id,o])=>o.role===1):list).filter(([id,o])=>!o.iv||id===myId);
 drawFx(t);
 drawFoxfires(t);
 for(const [id,o] of vis)if(o.ds&&t-(o.ghT||0)>45){o.ghT=t;ghosts.push({x:o.x,y:o.y,face:o.face,hue:o.hue,cls:o.cls,t0:t})}
 drawGhosts(t);
 for(const [id,o] of vis){if(id===myId&&o.iv)ctx.globalAlpha=.4;drawPlayer(o,id===myId);ctx.globalAlpha=1}
 for(const [id,o] of vis){const b=bubbles.get(id);if(b){if(t>b.until)bubbles.delete(id);else drawBubble(o,b)}}
 drawArrows(t);drawHits(t);updateSkillbar(t);
 updateBanner(t);
}
requestAnimationFrame(frame);
</script></body></html>
